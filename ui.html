<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dockdong</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #333333;
            --hover-bg: #1a1a1a;
            --accent: #ffffff;
            --accent-hover: #cccccc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 16px 0;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #222;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            color: #000;
            background-color: #fff;
            border-color: #fff;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }

        button:hover {
            background-color: var(--hover-bg);
            border-color: #555;
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        button.primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 16px 0;
        }

        .footer-text {
            font-size: 11px;
            color: #666;
            text-align: center;
        }

        /* Radio group for app selection */
        .app-selector {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .app-selector button {
            border: none;
            border-radius: 0;
            margin: 0;
            flex: 1;
            background-color: transparent;
        }

        .app-selector button.selected {
            background-color: #333;
        }

        .app-selector button:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }
    </style>
</head>

<body>

    <h1>
        dockdong
        <span id="status-badge" class="status-badge">Stopped</span>
    </h1>

    <div class="app-selector">
        <button id="btn-spotify" class="selected" onclick="sendCommand('use_spotify')">Spotify</button>
        <button id="btn-apple" onclick="sendCommand('use_apple_music')">Apple Music</button>
    </div>

    <div class="button-group">
        <div class="row">
            <button id="btn-start" class="primary" onclick="sendCommand('start')">Start</button>
            <button id="btn-stop" onclick="sendCommand('stop')">Stop</button>
        </div>
        <button onclick="sendCommand('update_now')">Update Now</button>
    </div>

    <div class="divider"></div>

    <div class="row">
        <button onclick="sendCommand('quit')">Quit</button>
    </div>

    <script>
        // Set up the state
        let currentApp = 'spotify';
        let isRunning = false;

        function updateUI() {
            // Update app selection
            document.getElementById('btn-spotify').classList.toggle('selected', currentApp === 'spotify');
            document.getElementById('btn-apple').classList.toggle('selected', currentApp === 'apple_music');

            // Update status badge
            const badge = document.getElementById('status-badge');
            if (isRunning) {
                badge.textContent = 'Running';
                badge.classList.add('active');
            } else {
                badge.textContent = 'Stopped';
                badge.classList.remove('active');
            }
        }

        function sendCommand(cmd) {
            // Handle local UI state updates instantly
            if (cmd === 'use_spotify') currentApp = 'spotify';
            if (cmd === 'use_apple_music') currentApp = 'apple_music';
            if (cmd === 'start') isRunning = true;
            if (cmd === 'stop') isRunning = false;

            updateUI();

            // Send to Python backend via WKScriptMessageHandler
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.python) {
                window.webkit.messageHandlers.python.postMessage(cmd);
            }
        }

        // Expose function for Python to update status text from backend worker
        window.setStatusText = function (text) {
            const badge = document.getElementById('status-badge');
            badge.textContent = text;
            if (text.toLowerCase() === 'running' || text.toLowerCase() === 'updated') {
                badge.classList.add('active');
            } else {
                badge.classList.remove('active');
            }
        };

        updateUI();
    </script>
</body>

</html>
